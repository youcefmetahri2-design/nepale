
name: Build NetGuard AI Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install psutil pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NetGuard_AI netguard_ai.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetGuard_AI-Windows
          path: dist/NetGuard_AI.exe
